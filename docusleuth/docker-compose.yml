services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docusleuth
      POSTGRES_USER: docusleuth
      POSTGRES_PASSWORD: docusleuth_local_only
    ports: ["5432:5432"]
    volumes: ["docusleuth_pgdata:/var/lib/postgresql/data"]
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://docusleuth:docusleuth_local_only@db:5432/docusleuth
      APP_COOKIE_SECURE: "false"
      PORT: 8000
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
    volumes:
      - ./frontend:/app
      - docusleuth_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  docusleuth_pgdata:
  docusleuth_node_modules:
